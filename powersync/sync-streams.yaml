      - SELECT feed_transactions.* FROM feed_transactions INNER JOIN farm_members ON farm_members.farm_id = feed_transactions.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT treatments.* FROM treatments INNER JOIN farm_members ON farm_members.farm_id = treatments.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT treatment_animals.* FROM treatment_animals INNER JOIN farm_members ON farm_members.farm_id = treatment_animals.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
