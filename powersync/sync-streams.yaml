config:
  edition: 3

streams:
  user_farm_data:
    auto_subscribe: true
    queries:
      - SELECT profiles.* FROM profiles WHERE profiles.id = auth.user_id()
      - SELECT farm_members.* FROM farm_members WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT farms.* FROM farms INNER JOIN farm_members ON farm_members.farm_id = farms.id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT farm_settings.* FROM farm_settings INNER JOIN farm_members ON farm_members.farm_id = farm_settings.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT milk_pricing_configs.* FROM milk_pricing_configs INNER JOIN farm_members ON farm_members.farm_id = milk_pricing_configs.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT animals.* FROM animals INNER JOIN farm_members ON farm_members.farm_id = animals.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT animal_labels.* FROM animal_labels INNER JOIN farm_members ON farm_members.farm_id = animal_labels.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT animal_label_links.* FROM animal_label_links INNER JOIN farm_members ON farm_members.farm_id = animal_label_links.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT buyers.* FROM buyers INNER JOIN farm_members ON farm_members.farm_id = buyers.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT buyer_payments.* FROM buyer_payments INNER JOIN farm_members ON farm_members.farm_id = buyer_payments.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
      - SELECT verka_billing_cycles.* FROM verka_billing_cycles INNER JOIN farm_members ON farm_members.farm_id = verka_billing_cycles.farm_id WHERE farm_members.user_id = auth.user_id() AND farm_members.status = 'active' AND farm_members.deleted_at IS NULL
