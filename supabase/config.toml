# Local database-only configuration for migration and pgTAP testing.
# Generate no production secrets from this file.
project_id = "laveri"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["laveri://auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false
